# Runs on a 1 GB droplet next to other production apps, so it is boxed in:
# - at most 450 MB of RAM and 60% of the CPU, with low CPU priority, so the other
#   apps win whenever both are busy
# - oom_score_adj 1000: if the host ever runs out of memory, the kernel kills
#   Raptor's processes first, never the neighbours
# - listens on localhost only; Caddy terminates TLS in front of it
name: raptor

services:
  api:
    build: .
    image: raptor-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 450m
    memswap_limit: 700m
    cpus: 0.6
    cpu_shares: 256
    oom_score_adj: 1000
    pids_limit: 256
    # Read-only filesystem: even a compromised scanner can't change Raptor's code
    # or plant files. /tmp is the only writable place (a disk volume, not RAM, so
    # unpacked repos don't count against the memory cap).
    read_only: true
    volumes:
      - scratch:/tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  scratch:
