# Runs on a 1 GB droplet next to other apps, so it is boxed in: it can't use more
# than ~640 MB of RAM or 90% of the CPU, and it only listens on localhost (Caddy
# terminates TLS in front of it).
name: raptor

services:
  api:
    build: .
    image: raptor-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    mem_limit: 640m
    memswap_limit: 1g
    cpus: 0.9
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
